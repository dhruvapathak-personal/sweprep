name: Verify application
on:
  pull_request:
  push:
    branches: [main, factory/mvp1-text-study-loop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: npm ci
      - run: python3 -m unittest discover -s tests/setup -p 'test_*.py'
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 scripts/local-stack.py start
      - run: python3 scripts/local-stack.py prepare-test
      - run: npm run test:integration
        env:
          PGHOSTADDR: 127.0.0.2
      - run: python3 scripts/local-stack.py types && git --no-pager diff --exit-code -- lib/contracts/database.types.ts
